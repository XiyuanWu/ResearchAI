{% comment %} 3.1 Frontend {% endcomment %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResearchAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/chat.css' %}" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">ResearchAI</div>
        <button type="button" class="new-chat" id="new-chat">
          <svg class="new-chat-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 20h9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>New chat</span>
        </button>
        <div class="select-bar" id="select-bar" hidden>
          <button type="button" class="select-cancel" id="select-cancel">Cancel</button>
          <button type="button" class="select-delete" id="select-delete" disabled>
            Delete
          </button>
        </div>
        <nav class="chat-list" id="chat-list" aria-label="Chat history"></nav>
      </aside>

      <div class="shell">
        <header class="topbar">
          <button type="button" class="menu-btn" id="menu-btn" aria-label="Open chats">
            ☰
          </button>
          <div class="current-title" id="current-title">ResearchAI</div>
        </header>

        <main class="chat" id="chat">
          <div class="empty" id="empty-state">
            <h1>ResearchAI</h1>
            <p>Ask anything about your research materials.</p>
          </div>
          <div class="messages" id="messages" hidden></div>
        </main>

        <footer class="composer-wrap">
          <form class="composer" id="composer">
            <input
              type="file"
              id="file-input"
              accept=".txt,.md,text/plain,text/markdown"
              hidden
            />
            <div class="composer-files" id="composer-files" hidden></div>
            <button type="button" class="upload-btn" id="upload-btn" aria-label="Upload file">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 16V6m0 0 4 4m-4-4-4 4M5 18h14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <textarea
              id="prompt"
              rows="1"
              placeholder="Message ResearchAI…"
              autocomplete="off"
            ></textarea>
            <button type="submit" id="send" aria-label="Send">↑</button>
          </form>
        </footer>
      </div>

      <div class="backdrop" id="backdrop" hidden></div>

      <div class="modal-backdrop" id="file-error-modal" hidden>
        <div
          class="modal"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="file-error-title"
          aria-describedby="file-error-message"
        >
          <h2 class="modal-title" id="file-error-title">Unsupported file</h2>
          <p class="modal-message" id="file-error-message">
            Only .txt and .md files are allowed.
          </p>
          <button type="button" class="modal-ok" id="file-error-ok">OK</button>
        </div>
      </div>
    </div>
    <script type="module" src="{% static 'js/chat.js' %}"></script>
  </body>
</html>
